[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "npm", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Publish the generated package-manager installers after artifacts are hosted
publish-jobs = ["homebrew", "npm"]
# Public package names
npm-package = "arcthis"
tap = "mkynyd/homebrew-tap"
# Build every public binary with the complete command set
all-features = true
# Attach GitHub provenance attestations to release artifacts
github-attestations = true
# Build and upload the full release matrix on pull requests before a tag is allowed
pr-run-mode = "upload"
# Whether to install an updater program
install-updater = false

[dist.dependencies.homebrew]
libarchive = "*"
libb2 = "*"
bzip2 = "*"
lz4 = "*"
xz = "*"
zstd = "*"

[dist.dependencies.apt]
libarchive-dev = "*"
libb2-dev = "*"
libbz2-dev = "*"
liblz4-dev = "*"
liblzma-dev = "*"
libxml2-dev = "*"
libzstd-dev = "*"
zlib1g-dev = "*"
