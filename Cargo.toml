[package]
name = "arcthis"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "An agent-native CLI for accessing and manipulating compressed files"
documentation = "https://docs.rs/arcthis"
license = "MIT"
readme = "README.md"
exclude = ["log.md"]
keywords = ["archive", "cli", "agent", "zip", "tar"]
categories = ["command-line-utilities", "compression"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
flate2 = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
tempfile = "3.27"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting"] }
walkdir = "2.5"
zip = { version = "8.2", default-features = false, features = ["deflate-flate2", "time"] }

[dev-dependencies]
assert_cmd = "2.2"

[profile.release]
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
