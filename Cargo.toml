[package]
name = "arcthis"
version = "0.5.0-rc.2"
edition = "2024"
rust-version = "1.98"
description = "An agent-native CLI for accessing and manipulating compressed files"
documentation = "https://docs.rs/arcthis"
homepage = "https://arcthis.mkynstudio.top"
repository = "https://github.com/mkynyd/arcthis"
license = "MIT"
readme = "README.md"
include = [
    "Cargo.toml",
    "Cargo.lock",
    "rust-toolchain.toml",
    "src/**",
    "tests/**",
    "README.md",
    "README.zh-CN.md",
    "START.md",
    "START.zh-CN.md",
    "INDEX.md",
    "ROADMAP.md",
    "CHANGELOG.md",
    "LICENSE",
    "THIRD_PARTY_LICENSES.md",
    "docs/**",
]
keywords = ["archive", "cli", "agent", "zip", "tar"]
categories = ["command-line-utilities", "compression"]

[dependencies]
bzip2 = "0.6"
base64 = { version = "0.23", optional = true }
clap = { version = "4.6", features = ["derive"] }
compress-tools = { version = "0.16", default-features = false, features = ["static"] }
directories = "6.0"
flate2 = "1.1"
globset = "0.4"
lzma-rust2 = "0.20"
mime_guess = "2.0"
rmcp = { version = "=3.1.4", optional = true, default-features = false, features = ["base64", "macros", "server", "transport-io"] }
schemars = { version = "1.2", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sevenz-rust2 = { version = "0.22", default-features = false, features = ["aes256", "bzip2", "compress", "deflate", "ppmd", "util", "zstd"] }
tar = "0.4"
tempfile = "3.27"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.47", optional = true, features = ["rt-multi-thread", "time"] }
walkdir = "2.5"
zip = { version = "=8.2.0", default-features = false, features = ["aes-crypto", "deflate-flate2", "time"] }
zstd = { version = "0.13", default-features = false }

[features]
default = ["mcp"]
mcp = ["dep:base64", "dep:rmcp", "dep:schemars", "dep:tokio"]

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
assert_cmd = "2.2"

[profile.release]
lto = "thin"
strip = "symbols"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
